  // ---------- search index ----------
  INS.forEach(i => {
    i._al = i.alias.map(norm);
    i._title = norm(i.es + ' ' + i.en);
    i._desc = norm(i.desc.join(' '));
    i._terms = i.groups.flatMap(g => [g, ...(GROUPS[g] ? GROUPS[g].terms : [])]).map(norm);
  });
  const ALL_TERMS = D.groups.map(g => ({ label: g.label, terms: [g.label, ...g.terms].map(norm) }));

  function scoreOne(i, t) {
    let s = 0;
    for (const a of i._al) {
      if (a === t) s = Math.max(s, 1000);
      else if (a.startsWith(t)) s = Math.max(s, 600 - (a.length - t.length) * 10);
    }
    for (const term of i._terms) {
      if (term === t) s = Math.max(s, 300);
      else if (t.length >= 3 && term.startsWith(t)) s = Math.max(s, 160);
    }
    if (t.length >= 2) {
      const re = new RegExp('(^|[^a-z0-9])' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      if (re.test(i._title)) s = Math.max(s, 90);
      else if (t.length >= 3 && i._title.includes(t)) s = Math.max(s, 60);
      if (t.length >= 4 && i._desc.includes(t)) s = Math.max(s, 15);
    }
    return s;
  }
  const OPERAND = /^(r\d{1,2}|0x[0-9a-f]+|\d+|[xyz][+]?|-[xyz]|[xyz]l|[xyz]h|k|rd|rr|,)$/;
  function search(raw) {
    const full = norm(raw);
    if (!full) return { list: [], groups: [] };
    const tokens = full.split(/[\s,]+/).filter(Boolean);
    const groups = ALL_TERMS.filter(g => g.terms.some(t => t === full || (full.length >= 3 && t.startsWith(full)))).map(g => g.label);
    const res = [];
    for (const i of INS) {
      let s = scoreOne(i, full);
      if (!s && tokens.length > 1) {
        let sum = 0, ok = true, any = false;
        for (const t of tokens) {
          const v = scoreOne(i, t);
          if (v) { sum += v; any = true; } else if (!OPERAND.test(t)) { ok = false; break; }
        }
        if (ok && any) s = sum;
      }
      if (s) res.push([s, i]);
    }
    const order = groups.length ? GROUPS[groups[0]].mns : [];
    const pos = i => { const k = order.findIndex(m => i.alias.includes(m)); return k < 0 ? 999 : k; };
    let list = res;
    if (groups.length) list = res.filter(r => r[0] >= 150);
    list.sort((a, b) => b[0] - a[0] || pos(a[1]) - pos(b[1]) || a[1].mn.localeCompare(b[1].mn) || parseFloat(a[1].num.slice(2)) - parseFloat(b[1].num.slice(2)));
    return { list: list.map(r => r[1]), groups };
  }

  // ---------- rendering helpers ----------
  const stCls = v => v === '⇔' ? 'chg' : v === '0' ? 'v0' : v === '1' ? 'v1' : '';
  function flagPills(i) {
    if (!i.sreg) return '<span class="fl-cap">SREG: no indicado</span>';
    const on = FLAGS.map((f, k) => [f, i.sreg[k]]).filter(([, v]) => v !== '–');
    if (!on.length) return '<span class="fl-cap">SREG sin cambios</span>';
    return '<span class="fl-cap">SREG</span>' + on.map(([f, v]) => `<span class="fl ${stCls(v)}" title="${FLAG_NAMES[f]}: ${v === '⇔' ? 'se modifica' : 'se pone en ' + v}">${f}</span>`).join('');
  }
  function card(i) {
    const syn = i.syn.map(s => s.syn).filter((v, k, a) => a.indexOf(v) === k).slice(0, 2).join(' · ');
    return `<a class="card" href="#${i.id}" data-id="${i.id}">
      <div class="top"><span class="mn">${esc(i.mn)}</span><span class="num">${esc(i.variant || i.num)}</span></div>
      <div class="es">${esc(i.es)}</div>
      <div class="syn">${esc(syn)}</div>
      <div class="flags">${flagPills(i)}</div>
    </a>`;
  }
  function filtered(list) { return cat === 'all' ? list : list.filter(i => i.cat === cat); }

  function renderCats() {
    const opts = [['all', 'Todas', INS.length]].concat(Object.entries(CATS).map(([k, v]) => [k, v, INS.filter(i => i.cat === k).length]));
    $('#cats').innerHTML = opts.map(([k, v, n]) => `<button class="cat" type="button" data-cat="${k}" aria-pressed="${k === cat}">${esc(v)} <span class="cn">${n}</span></button>`).join('');
  }

  function renderCategory() {
    const list = INS.filter(i => i.cat === cat).sort((a, b) => a.rank - b.rank);
    main.innerHTML = `<section class="sec"><div class="sec-h"><h2>${esc(CATS[cat])} · ${list.length} instrucciones</h2></div>
      <div class="grid">${list.map(card).join('')}</div></section>`;
  }
  function renderHome() {
    if (cat !== 'all') return renderCategory();
    const common = filtered(D.common.map(m => INS.find(i => i.mn === m && !i.variant)).filter(Boolean));
    const byCat = Object.keys(CATS).filter(c => cat === 'all' || c === cat).map(c => {
      const list = INS.filter(i => i.cat === c).sort((a, b) => a.rank - b.rank);
      return `<div class="group"><h3>${esc(CATS[c])} <span>${list.length}</span></h3><div class="rows">${list.map(i => `<a class="row" href="#${i.id}"><b>${esc(i.mn)}</b><span>${esc(i.es)}${i.variant ? ` <em>${esc(i.variant)}</em>` : ''}</span></a>`).join('')}</div></div>`;
    }).join('');
    const tagCounts = D.groups.map(g => [g.label, INS.filter(i => i.groups.includes(g.label)).length]);
    main.innerHTML = `
      ${common.length ? `<section class="sec"><div class="sec-h"><h2>Comandos más usados</h2><span class="note">Toca una tarjeta para ver opcode, SREG y ejemplo</span></div>
        <div class="grid">${common.map(card).join('')}</div></section>` : ''}
      <section class="sec"><div class="sec-h"><h2>Buscar por operación</h2><span class="note">Cada etiqueta agrupa sinónimos en español e inglés</span></div>
        <div class="tags">${tagCounts.map(([l, n]) => `<button class="tag" type="button" data-q="${esc(l)}">${esc(l)}<small>${n}</small></button>`).join('')}</div></section>
      <section class="sec"><div class="sec-h"><h2>Todas las instrucciones</h2><span class="note">Por categoría, de las más usadas a las menos usadas</span></div>
        <div class="index">${byCat}</div></section>
      <aside class="official">
        <div><strong>Versión completa y oficial disponible</strong><span>El manual de Microchip incluye las fórmulas booleanas, las tablas de ciclos y los capítulos que no están en esta página.</span></div>
        <a class="dl" href="https://ww1.microchip.com/downloads/en/DeviceDoc/AVR-Instruction-Set-Manual-DS40002198A.pdf" target="_blank" rel="noopener">Descargar el manual oficial (PDF)</a>
      </aside>`;
  }

  function renderResults(raw) {
    const { list, groups } = search(raw);
    const shown = filtered(list);
    const hidden = list.length - shown.length;
    const syn = groups.slice(0, 3).map(g => {
      const terms = GROUPS[g].terms.slice(0, 6).join(', ');
      return `<b>${esc(g)}</b> <span class="small">(${esc(terms)})</span>`;
    }).join(' · ');
    main.innerHTML = `<section class="sec">
      <div class="sec-h"><h2>${shown.length} resultado${shown.length === 1 ? '' : 's'} para “${esc(raw.trim())}”</h2>
        ${hidden ? `<span class="note">${hidden} más en otras categorías · <a href="#" data-cat-all="1">ver todas</a></span>` : ''}</div>
      ${syn ? `<div class="hint">Operación: ${syn}</div>` : ''}
      ${shown.length ? `<div class="grid">${shown.map(card).join('')}</div>` :
        `<div class="empty"><strong>No encontré instrucciones para “${esc(raw.trim())}”.</strong><span>Prueba con el mnemónico (ej. <b>brne</b>) o con una operación: sumar, limpiar, saltar, comparar, puerto, pila.</span></div>`}
    </section>`;
  }

  function hl(code) {
    return code.split('\n').map(line => {
      let com = '', body = line;
      const k = line.indexOf(';');
      if (k >= 0) { com = line.slice(k); body = line.slice(0, k); }
      let out = '';
      const m = body.match(/^(\s*)([A-Za-z_][\w]*:)?(\s*)([A-Za-z.]+)?(.*)$/);
      if (m) {
        const [, s1, lbl, s2, mn, rest] = m;
        out += esc(s1);
        if (lbl) out += `<span class="c-lbl">${esc(lbl)}</span>`;
        out += esc(s2);
        if (mn) out += (MN_SET.has(mn.toUpperCase()) || /^(lds|sts|ldd|std|spm|eicall|eijmp)$/i.test(mn)) ? `<span class="c-mn">${esc(mn)}</span>` : esc(mn);
        out += esc(rest)
          .replace(/\b(r\d{1,2}|[XYZ][LH]?)\b/g, '<span class="c-reg">$1</span>')
          .replace(/(^|[^\w])(0x[0-9A-Fa-f]+|0b[01]+|\d+)\b/g, '$1<span class="c-num">$2</span>');
      } else out = esc(body);
      return out + (com ? `<span class="c-com">${esc(com)}</span>` : '');
    }).join('\n');
  }

  function opcodeHTML(i) {
    const o = i.opc;
    if (!o.rows.length) return `<p class="opnote">${esc(o.note)}</p>`;
    const used = new Set();
    const rows = o.rows.flatMap(r => {
      const words = r.bits.length === 32 ? [r.bits.slice(0, 16), r.bits.slice(16)] : [r.bits];
      return words.map((w, wi) => {
        const lab = words.length > 1 ? `${r.v ? r.v + ' · ' : ''}Palabra ${wi + 1} de 2` : r.v;
        const nibs = [0, 4, 8, 12].map(n => `<span class="nib">${[...w.slice(n, n + 4)].map(b => {
          if (b === '0' || b === '1') return `<span class="bit">${b}</span>`;
          used.add(b); return `<span class="bit fx" style="background:var(--f-${b})" title="${esc(FIELD[b] || b)}">${b}</span>`;
        }).join('')}</span>`).join('');
        return `<div class="opc-row">${lab ? `<span class="lab">${esc(lab)}</span>` : ''}<div class="bits">${nibs}</div></div>`;
      });
    }).join('');
    const legend = [...used].map(b => `<span><i class="sw" style="background:var(--f-${b})"></i><b style="font-family:var(--font-mono)">${b}</b> ${esc(FIELD[b] || '')}</span>`).join('');
    return `<div class="opc">${rows}</div>${legend ? `<div class="legend">${legend}</div>` : ''}${o.note ? `<p class="opnote">${esc(o.note)}</p>` : ''}`;
  }

  function sregHTML(i) {
    if (!i.sreg) return '<p class="small">El manual no incluye la tabla del SREG para esta instrucción.</p>';
    const strip = FLAGS.map((f, k) => {
      const v = i.sreg[k];
      const what = v === '⇔' ? 'se modifica según el resultado' : v === '0' ? 'se pone en 0' : v === '1' ? 'se pone en 1' : 'no cambia';
      return `<div class="sr ${stCls(v)}" title="${FLAG_NAMES[f]} (${f}): ${what}"><span class="k">${f}</span><span class="s">${esc(v)}</span></div>`;
    }).join('');
    const notes = FLAGS.filter(f => i.flags[f]).map(f => `<div><dt>${f}</dt><dd>${esc(i.flags[f])}</dd></div>`).join('');
    const none = i.sreg.every(v => v === '–');
    return `<div class="sreg" role="img" aria-label="Registro de estado">${strip}</div>
      ${none ? '<p class="small">Esta instrucción no modifica ninguna bandera.</p>' : ''}
      ${notes ? `<dl class="fnotes">${notes}</dl>` : ''}
      ${i.result.length ? `<p class="small">${esc(i.result.join(' '))}</p>` : ''}
      <p class="small">⇔ se modifica · 0 se pone en 0 · 1 se pone en 1 · – no cambia</p>`;
  }

  function related(i) {
    const txt = i.desc.join(' ');
    const ids = [];
    for (const m of txt.matchAll(/\b[A-Z]{2,6}\b/g)) {
      const w = m[0];
      if (w === i.mn || !MN_SET.has(w)) continue;
      const t = INS.find(x => x.alias.includes(w) && !x.variant) || INS.find(x => x.alias.includes(w));
      if (t && !ids.includes(t.id)) ids.push(t.id);
    }
    const g = i.groups[0];
    if (g) INS.filter(x => x.groups.includes(g) && x.id !== i.id && x.mn !== i.mn).slice(0, 8).forEach(x => { if (!ids.includes(x.id) && ids.length < 10) ids.push(x.id); });
    return ids.map(id => BY_ID[id]);
  }

  function wordsTxt(w) {
    const m = String(w).match(/^(\d+)\s*\((\d+)\s*bytes?\)/);
    return m ? `${m[1]} palabra${m[1] === '1' ? '' : 's'} (${m[2]} bytes)` : esc(w);
  }
  function renderDetail(i, fromQuery) {
    const hasCom = i.ops.some(r => r.com);
    const multi = i.ops.length > 1 || i.syn.length > 1;
    const opsT = `<div class="tbl-wrap"><table><thead><tr>${multi ? '<th></th>' : ''}<th>Operación</th>${hasCom ? '<th>Comentario</th>' : ''}</tr></thead><tbody>
      ${i.ops.map(r => `<tr>${multi ? `<td class="v">${esc(r.v)}</td>` : ''}<td class="m">${esc(r.op)}</td>${hasCom ? `<td class="c">${esc(r.com)}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
    const synT = `<div class="tbl-wrap"><table class="wide"><thead><tr>${multi ? '<th></th>' : ''}<th>Sintaxis</th><th>Operandos</th><th>Contador de programa</th>${i.stack ? '<th>Pila</th>' : ''}</tr></thead><tbody>
      ${i.syn.map(r => `<tr>${multi ? `<td class="v">${esc(r.v)}</td>` : ''}<td class="m"><b>${esc(r.syn)}</b></td><td class="m">${esc(r.opd)}</td><td class="m">${esc(r.pc)}</td>${i.stack ? `<td class="m">${esc(r.st)}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
    const rel = related(i);
    const ref = `Sección ${esc(i.num)} · pág. ${i.page}` + (MANUAL_URL ? ` · <a href="${MANUAL_URL}#page=${i.page}" target="_blank" rel="noopener">abrir en el manual</a>` : '');
    main.innerHTML = `<article class="sheet">
      <div class="sheet-head">
        <a class="back" href="#" id="back">← ${fromQuery ? 'Volver a los resultados' : 'Volver al inicio'}</a>
        <div class="title-row"><span class="mn">${esc(i.mn)}</span><h2>${esc(i.es)}</h2></div>
        <div class="meta"><span class="badge">${esc(CATS[i.cat])}</span>${i.variant ? `<span class="badge">Núcleo ${esc(i.variant)}</span>` : ''}<span class="en">${esc(i.mn)} – ${esc(i.en)}</span><span>${wordsTxt(i.words)}</span><span class="ref">${ref}</span></div>
      </div>
      <div class="sheet-body">
        <div class="col">
          <section class="blk desc"><h3>Descripción</h3>${i.desc.map(p => `<p>${esc(p)}</p>`).join('')}</section>
          <section class="blk"><h3>Operación</h3>${opsT}</section>
          <section class="blk"><h3>Sintaxis</h3>${synT}</section>
        </div>
        <div class="col">
          <section class="blk">${i.ex ? `<h3>Ejemplo <span class="exm"><small class="src">Del manual</small><button class="copy" type="button" id="copy">Copiar</button></span></h3>
            <div class="code"><pre><code>${hl(i.ex)}</code></pre></div>` : `<h3>Ejemplo</h3><p class="small">El manual no incluye un ejemplo para esta instrucción.</p>`}</section>
          <section class="blk"><h3>Opcode <small>${i.opc.size} bits</small></h3>${opcodeHTML(i)}</section>
          <section class="blk"><h3>Registro de estado (SREG)</h3>${sregHTML(i)}</section>
          ${rel.length ? `<section class="blk"><h3>Ver también</h3><div class="see">${rel.map(r => `<a href="#${r.id}" title="${esc(r.es)}">${esc(r.mn)}${r.variant ? ' ' + esc(r.variant) : (r.mn === 'LD' || r.mn === 'ST' ? ' ' + r.id.slice(-1).toUpperCase() : '')}</a>`).join('')}</div></section>` : ''}
        </div>
      </div>
    </article>`;
    $('#back').addEventListener('click', e => { e.preventDefault(); go(''); });
    if ($('#copy')) $('#copy').addEventListener('click', e => {
      const btn = e.currentTarget;
      const done = () => { btn.textContent = 'Copiado'; setTimeout(() => { btn.textContent = 'Copiar'; }, 1400); };
      try {
        navigator.clipboard.writeText(i.ex).then(done, () => selectCode(btn));
      } catch (err) { selectCode(btn); }
    });
    window.scrollTo({ top: 0 });
  }
  function selectCode(btn) {
    const pre = btn.closest('.blk').querySelector('pre');
    const r = document.createRange(); r.selectNodeContents(pre);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = 'Seleccionado: Ctrl+C';
  }

  // ---------- routing / state ----------
  function render() {
    const id = decodeURIComponent(location.hash.slice(1));
    clearBtn.hidden = !q.value;
    if (id && BY_ID[id]) { renderDetail(BY_ID[id], !!q.value.trim()); return; }
    if (q.value.trim()) renderResults(q.value); else renderHome();
  }
  function go(hash) {
    if (hash) { location.hash = hash; return; }
    if (location.hash) history.pushState(null, '', location.pathname + location.search);
    render();
  }

  let t;
  q.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      render();
    }, 60);
  });
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const first = main.querySelector('.card'); if (first) { e.preventDefault(); go(first.dataset.id); } }
    if (e.key === 'Escape') { q.value = ''; go(''); }
  });
  clearBtn.addEventListener('click', () => { q.value = ''; q.focus(); go(''); });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
  });
  $('#home').addEventListener('click', e => { e.preventDefault(); q.value = ''; go(''); });
  $('#cats').addEventListener('click', e => {
    const b = e.target.closest('.cat'); if (!b) return;
    cat = b.dataset.cat;
    renderCats();
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    render();
  });
  main.addEventListener('click', e => {
    const tg = e.target.closest('.tag');
    if (tg) { q.value = tg.dataset.q; go(''); q.focus(); window.scrollTo({ top: 0 }); return; }
    const all = e.target.closest('[data-cat-all]');
    if (all) { e.preventDefault(); cat = 'all'; renderCats(); render(); }
  });
  window.addEventListener('hashchange', render);
  window.addEventListener('popstate', render);

  renderCats();
  render();
})();
</script>

</body>
</html>
