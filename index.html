<style>
/* Layout: sticky search bench on top, reference sheet below (cards → detail sheet). Solder-mask green + copper pads. */
:root {
  --bg: #eef2f0;
  --surface: #ffffff;
  --sunk: #e4eae7;
  --ink: #15201c;
  --muted: #56645f;
  --line: #d3dcd8;
  --accent: #a94c22;       /* copper */
  --accent-ink: #ffffff;
  --mask: #1d6a57;         /* solder-mask green */
  --mask-soft: #d9ebe5;
  --code-bg: #17211e;
  --code-ink: #dfe8e4;
  --code-com: #8da39b;
  --code-mn: #f0a273;
  --code-reg: #8fd3bf;
  --code-num: #e6c97a;
  --code-lbl: #c7b2f0;
  --f-d: #1d6a57; --f-r: #2f5fa8; --f-K: #a94c22; --f-k: #7a4bb0; --f-A: #6d7414; --f-b: #b0336b; --f-s: #b0336b; --f-q: #9a6a00;
  --st-chg: #1d6a57; --st-0: #4a5560; --st-1: #a94c22;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #151e1b; --sunk: #1b2622; --ink: #e3ebe7; --muted: #94a59f; --line: #263430;
    --accent: #e4844f; --accent-ink: #1a0f08; --mask: #52b99b; --mask-soft: #173129;
    --code-bg: #0a100e; --code-ink: #dfe8e4; --code-com: #7c918a;
    --f-d: #52b99b; --f-r: #7aa6ec; --f-K: #e4844f; --f-k: #b591e6; --f-A: #b9c04a; --f-b: #e875a8; --f-s: #e875a8; --f-q: #e0b14a;
    --st-chg: #52b99b; --st-0: #9aa6b0; --st-1: #e4844f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #151e1b; --sunk: #1b2622; --ink: #e3ebe7; --muted: #94a59f; --line: #263430;
  --accent: #e4844f; --accent-ink: #1a0f08; --mask: #52b99b; --mask-soft: #173129;
  --code-bg: #0a100e; --code-ink: #dfe8e4; --code-com: #7c918a;
  --f-d: #52b99b; --f-r: #7aa6ec; --f-K: #e4844f; --f-k: #b591e6; --f-A: #b9c04a; --f-b: #e875a8; --f-s: #e875a8; --f-q: #e0b14a;
  --st-chg: #52b99b; --st-0: #9aa6b0; --st-1: #e4844f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- sticky search bench ---------- */
.bench { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bench .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand a { text-decoration: none; display: flex; align-items: baseline; gap: 10px; }
.brand .chip-ic { font-family: var(--font-mono); font-weight: 700; font-size: 13px; letter-spacing: .06em; color: var(--accent-ink); background: var(--accent); padding: 2px 7px; border-radius: 4px; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.005em; }
.brand .sub { color: var(--muted); font-size: 13px; }
.brand { position: relative; padding-right: 44px; }
.theme { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); cursor: pointer; }
.theme:hover { border-color: var(--mask); color: var(--mask); }
.theme svg { width: 18px; height: 18px; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
#q { width: 100%; font: 500 17px/1.2 var(--font-mono); color: var(--ink); background: var(--sunk); border: 1.5px solid var(--line); border-radius: var(--r); padding: 13px 88px 13px 42px; outline: none; transition: border-color .15s, background .15s; }
#q::placeholder { color: var(--muted); font-family: var(--font-ui); font-weight: 400; }
#q:focus { border-color: var(--mask); background: var(--surface); }
.kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; align-items: center; }
.kbd kbd { font: 500 12px var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--surface); }
#clear { font: 500 13px var(--font-ui); color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
#clear:hover, #clear:focus-visible { color: var(--ink); background: var(--line); outline: none; }
.cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; font: 500 13px var(--font-ui); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.cat:hover { color: var(--ink); border-color: var(--muted); }
.cat .cn { font-family: var(--font-mono); font-size: 11.5px; opacity: .7; margin-left: 2px; }
.cat[aria-pressed="true"] { color: var(--surface); background: var(--ink); border-color: var(--ink); }
.cat:focus-visible, .card:focus-visible, .tag:focus-visible, .row:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- sections ---------- */
main { padding-block: 22px 56px; }
.sec { display: grid; gap: 12px; margin-bottom: 34px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-h h2 { margin: 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.sec-h .note { color: var(--muted); font-size: 13px; }
.hint { background: var(--mask-soft); color: var(--ink); border-radius: var(--r); padding: 10px 14px; font-size: 14px; }
.hint b { font-family: var(--font-mono); }

/* ---------- cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.card { display: grid; grid-template-rows: auto auto 1fr auto; gap: 4px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 12px; min-width: 0; transition: border-color .12s, transform .12s; }
.card:hover { border-color: var(--mask); transform: translateY(-1px); }
.card .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.mn { font-family: var(--font-mono); font-weight: 700; font-size: 21px; letter-spacing: .01em; color: var(--accent); }
.card .num { font: 400 12px var(--font-mono); color: var(--muted); }
.card .es { font-weight: 500; font-size: 14.5px; line-height: 1.35; }
.card .syn { font: 400 13px var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.flags { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.fl { font: 600 11px/1 var(--font-mono); width: 19px; height: 19px; display: inline-grid; place-items: center; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); opacity: .55; }
.fl.chg { background: var(--st-chg); border-color: var(--st-chg); color: var(--surface); opacity: 1; }
.fl.v0 { border-color: var(--st-0); color: var(--st-0); opacity: 1; }
.fl.v1 { border-color: var(--st-1); color: var(--st-1); opacity: 1; }
.fl-cap { font-size: 11px; color: var(--muted); margin-right: 4px; text-transform: uppercase; letter-spacing: .08em; }

/* ---------- tag chips ---------- */
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tag { font: 500 14px var(--font-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; }
.tag:hover { border-color: var(--mask); color: var(--mask); }
.tag small { color: var(--muted); font-weight: 400; margin-left: 4px; font-family: var(--font-mono); font-size: 12px; }

/* ---------- full index ---------- */
.index { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px 28px; }
.group h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.group h3 span { color: var(--muted); font-weight: 400; font-family: var(--font-mono); font-size: 12px; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: baseline; text-decoration: none; padding: 5px 6px; border-radius: 6px; min-width: 0; }
.row:hover { background: var(--surface); }
.row b { font: 600 14px var(--font-mono); color: var(--accent); }
.row span { font-size: 14px; color: var(--ink); min-width: 0; }
.row em { font-style: normal; color: var(--muted); font-size: 12px; font-family: var(--font-mono); }

.empty { text-align: center; padding: 40px 16px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty strong { color: var(--ink); font-size: 16px; }

/* ---------- detail sheet ---------- */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.sheet-head { padding: 22px 24px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.back { justify-self: start; font: 500 13px var(--font-ui); color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
.back:hover { color: var(--ink); }
.title-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.title-row .mn { font-size: 40px; line-height: 1; }
.title-row h2 { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
.meta { display: flex; gap: 8px 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.meta .en { font-style: italic; }
.badge { font: 500 12px var(--font-ui); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--ink); }
.sheet-body { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.col { padding: 20px 24px 24px; display: grid; gap: 24px; align-content: start; min-width: 0; }
.col + .col { border-left: 1px solid var(--line); background: color-mix(in srgb, var(--sunk) 45%, var(--surface)); }
.blk { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.col { grid-template-columns: minmax(0, 1fr); }
.blk > h3 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.blk > h3 small { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; }
.desc p { margin: 0 0 10px; max-width: 68ch; }
.desc p:last-child { margin-bottom: 0; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-weight: 600; font-size: 12px; color: var(--muted); background: var(--sunk); white-space: nowrap; }
td.m { font-family: var(--font-mono); font-size: 13px; white-space: pre-line; }
td.v { color: var(--muted); font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
td.c { color: var(--muted); }

/* opcode */
.opc { display: grid; gap: 8px; }
.opc-row { display: grid; gap: 4px; }
.opc-row .lab { font: 500 12px var(--font-mono); color: var(--muted); }
.bits { display: flex; gap: 6px; flex-wrap: wrap; }
.nib { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.bit { font: 600 15px/1 var(--font-mono); width: 24px; height: 30px; display: grid; place-items: center; border-right: 1px solid var(--line); color: var(--ink); }
.bit:last-child { border-right: 0; }
.bit.fx { color: var(--surface); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.opnote { font-size: 13px; color: var(--muted); }

/* sreg */
.sreg { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.sr { display: grid; text-align: center; border-right: 1px solid var(--line); }
.sr:last-child { border-right: 0; }
.sr .k { font: 600 13px var(--font-mono); padding: 5px 0; background: var(--sunk); color: var(--muted); border-bottom: 1px solid var(--line); }
.sr .s { font: 600 16px var(--font-mono); padding: 7px 0; color: var(--muted); }
.sr.chg .k { background: var(--st-chg); color: var(--surface); }
.sr.chg .s { color: var(--st-chg); }
.sr.v0 .k { background: var(--st-0); color: var(--surface); }
.sr.v0 .s { color: var(--st-0); }
.sr.v1 .k { background: var(--st-1); color: var(--surface); }
.sr.v1 .s { color: var(--st-1); }
.fnotes { display: grid; gap: 6px; margin: 0; }
.fnotes div { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 13.5px; }
.fnotes dt { font: 700 13px var(--font-mono); color: var(--mask); }
.fnotes dd { margin: 0; }
.small { font-size: 12.5px; color: var(--muted); }

/* code */
.code { position: relative; background: var(--code-bg); color: var(--code-ink); border-radius: 10px; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: 400 13.5px/1.6 var(--font-mono); tab-size: 4; }
.code .c-com { color: var(--code-com); }
.code .c-mn { color: var(--code-mn); font-weight: 600; }
.code .c-reg { color: var(--code-reg); }
.code .c-num { color: var(--code-num); }
.code .c-lbl { color: var(--code-lbl); }
.exm { display: inline-flex; gap: 10px; align-items: center; }
.copy { font: 500 12px var(--font-ui); text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 9px; cursor: pointer; }
.copy:hover { border-color: var(--mask); color: var(--mask); }
.src { font-size: 12px; color: var(--muted); }

.see { display: flex; gap: 6px; flex-wrap: wrap; }
.see a { font: 600 13px var(--font-mono); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--accent); background: var(--surface); }
.see a:hover { border-color: var(--accent); }
.ref { font-size: 13px; color: var(--muted); }
.ref a { color: var(--mask); }

.official { display: flex; gap: 14px 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r); padding: 16px 18px; }
.official div { display: grid; gap: 2px; min-width: 0; flex: 1 1 320px; }
.official span { color: var(--muted); font-size: 14px; }
.dl { flex: none; font: 600 14px var(--font-ui); text-decoration: none; color: var(--accent-ink); background: var(--accent); border-radius: 8px; padding: 9px 14px; }
.dl:hover { filter: brightness(1.08); }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
footer .wrap { padding-block: 18px 28px; display: grid; gap: 4px; }

@media (max-width: 820px) {
  .sheet-body { grid-template-columns: minmax(0, 1fr); }
  .col + .col { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 520px) {
  .brand .sub { display: none; }
  .kbd kbd { display: none; }
  #q { font-size: 16px; padding-right: 64px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .card .syn { display: none; }
  .sheet-head, .col { padding-left: 16px; padding-right: 16px; }
  .title-row .mn { font-size: 32px; }
  .title-row h2 { font-size: 19px; }
  .bit { width: 18px; height: 26px; font-size: 13px; }
  .bits { gap: 4px; }
  table.wide { min-width: 480px; }
  .index { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<header class="bench">
  <div class="wrap">
    <div class="brand">
      <button id="theme" class="theme" type="button" aria-label="Cambiar tema"></button>
      <a href="#" id="home"><span class="chip-ic">AVR</span><h1>Instrucciones AVR en ensamblador</h1></a>
    </div>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Busca un comando o una operación: ldi, saltar, clear, comparar…" aria-label="Buscar instrucción">
      <div class="kbd"><button id="clear" type="button" hidden>Borrar</button><kbd>/</kbd></div>
    </div>
    <div class="cats" id="cats" role="toolbar" aria-label="Filtrar por categoría"></div>
  </div>
</header>

<main class="wrap" id="main" tabindex="-1"></main>

<footer>
  <div class="wrap">
    <div><b>Autor:</b> Diego Gonzales</div>
    <div>Fuente: <i>AVR® Instruction Set Manual</i>, Microchip Technology Inc., DS40002198B, capítulo 6 “Instruction Description”.</div>

<script id="data" type="application/json">{"ins": [{"id": "adc", "num": "6.1", "page": 24, "mn": "ADC", "alias": ["ADC"], "variant": "", "en": "Add with Carry", "es": "Sumar con acarreo", "cat": "arit", "desc": ["Suma dos registros y el contenido de la bandera C, y coloca el resultado en el registro destino Rd."], "ops": [{"v": "(i)", "op": "Rd ← Rd + Rr + C", "com": ""}], "syn": [{"v": "(i)", "syn": "ADC Rd,Rr", "opd": "0 ≤ d ≤ 31, 0 ≤ r ≤ 31", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "000111rdddddrrrr"}], "note": ""}, "sreg": ["–", "–", "⇔", "⇔", "⇔", "⇔", "⇔", "⇔"], "flags": {"H": "1 si hubo acarreo desde el bit 3; 0 en caso contrario.", "S": "N ⊕ V, para pruebas con signo.", "V": "1 si la operación produjo desbordamiento en complemento a dos; 0 en caso contrario.", "N": "1 si el MSB del resultado está en 1; 0 en caso contrario.", "Z": "1 si el resultado es 0x00; 0 en caso contrario.", "C": "1 si hubo acarreo desde el MSB del resultado; 0 en caso contrario."}, "result": ["R (Resultado) es igual a Rd después de la operación."], "ex": "                ; Add R1:R0 to R3:R2\n    add  r2,r0  ; Add low byte\n    adc  r3,r1  ; Add with carry high byte", "src": "manual", "words": "1 (2 bytes)", "groups": ["sumar", "acarreo"], "common": false, "rank": 4001}, {"id": "add", "num": "6.2", "page": 25, "mn": "ADD", "alias": ["ADD"], "variant": "", "en": "Add without Carry", "es": "Sumar sin acarreo", "cat": "arit", "desc": ["Suma dos registros sin la bandera C y coloca el resultado en el registro destino Rd."], "ops": [{"v": "(i)", "op": "Rd ← Rd + Rr", "com": ""}], "syn": [{"v": "(i)", "syn": "ADD Rd,Rr", "opd": "0 ≤ d ≤ 31, 0 ≤ r ≤ 31", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "000011rdddddrrrr"}], "note": ""}, "sreg": ["–", "–", "⇔", "⇔", "⇔", "⇔", "⇔", "⇔"], "flags": {"H": "1 si hubo acarreo desde el bit 3; 0 en caso contrario.", "S": "N ⊕ V, para pruebas con signo.", "V": "1 si la operación produjo desbordamiento en complemento a dos; 0 en caso contrario.", "N": "1 si el MSB del resultado está en 1; 0 en caso contrario.", "Z": "1 si el resultado es 0x00; 0 en caso contrario.", "C": "1 si hubo acarreo desde el MSB del resultado; 0 en caso contrario."}, "result": ["R (Resultado) es igual a Rd después de la operación."], "ex": "    add  r1,r2    ; Add r2 to r1 (r1=r1+r2)\n    add  r28,r28  ; Add r28 to itself (r28=r28+r28)", "src": "manual", "words": "1 (2 bytes)", "groups": ["sumar"], "common": true, "rank": 2}, {"id": "adiw", "num": "6.3", "page": 26, "mn": "ADIW", "alias": ["ADIW"], "variant": "", "en": "Add Immediate to Word", "es": "Sumar inmediato a palabra (16 bits)", "cat": "arit", "desc": ["Suma un valor inmediato (0-63) a un par de registros y coloca el resultado en el par de registros. Esta instrucción opera sobre los cuatro pares de registros superiores y es muy adecuada para operaciones con los registros puntero.", "Esta instrucción no está disponible en todos los dispositivos. Consulte el Apéndice A."], "ops": [{"v": "(i)", "op": "R[d+1]:Rd ← R[d+1]:Rd + K", "com": ""}], "syn": [{"v": "(i)", "syn": "ADIW Rd,K", "opd": "d ∈ {24,26,28,30}, 0 ≤ K ≤ 63", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "10010110KKddKKKK"}], "note": ""}, "sreg": ["–", "–", "–", "⇔", "⇔", "⇔", "⇔", "⇔"], "flags": {"S": "N ⊕ V, para pruebas con signo.", "V": "1 si la operación produjo desbordamiento en complemento a dos; 0 en caso contrario.", "N": "1 si el MSB del resultado está en 1; 0 en caso contrario.", "Z": "1 si el resultado es 0x0000; 0 en caso contrario.", "C": "1 si hubo acarreo desde el MSB del resultado; 0 en caso contrario."}, "result": ["R (Resultado) es igual a R[d+1]:Rd después de la operación."], "ex": "    adiw  r24,1  ; Add 1 to r25:r24\n    adiw  ZL,63  ; Add 63 to the Z-pointer(r31:r30)", "src": "manual", "words": "1 (2 bytes)", "groups": ["sumar", "incrementar", "constante", "puntero", "16 bits"], "common": false, "rank": 8003}, {"id": "and", "num": "6.4", "page": 27, "mn": "AND", "alias": ["AND"], "variant": "", "en": "Logical AND", "es": "AND lógico", "cat": "logic", "desc": ["Realiza el AND lógico entre el contenido del registro Rd y el registro Rr, y coloca el resultado en el registro destino Rd."], "ops": [{"v": "(i)", "op": "Rd ← Rd ∧ Rr", "com": ""}], "syn": [{"v": "(i)", "syn": "AND Rd,Rr", "opd": "0 ≤ d ≤ 31, 0 ≤ r ≤ 31", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "001000rdddddrrrr"}], "note": ""}, "sreg": ["–", "–", "–", "⇔", "0", "⇔", "⇔", "–"], "flags": {"S": "N ⊕ V, para pruebas con signo.", "V": "Se pone en 0.", "N": "1 si el MSB del resultado está en 1; 0 en caso contrario.", "Z": "1 si el resultado es 0x00; 0 en caso contrario."}, "result": ["R (Resultado) es igual a Rd después de la operación."], "ex": "    and  r2,r3   ; Bitwise and r2 and r3, result in r2\n    ldi  r16,1   ; Set bitmask 0000 0001 in r16\n    and  r2,r16  ; Isolate bit 0 in r2", "src": "manual", "words": "1 (2 bytes)", "groups": ["limpiar", "AND"], "common": false, "rank": 20004}, {"id": "andi", "num": "6.5", "page": 28, "mn": "ANDI", "alias": ["ANDI"], "variant": "", "en": "Logical AND with Immediate", "es": "AND lógico con inmediato", "cat": "logic", "desc": ["Realiza el AND lógico entre el contenido del registro Rd y una constante, y coloca el resultado en el registro destino Rd."], "ops": [{"v": "(i)", "op": "Rd ← Rd ∧ K", "com": ""}], "syn": [{"v": "(i)", "syn": "ANDI Rd,K", "opd": "16 ≤ d ≤ 31, 0 ≤ K ≤ 255", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "0111KKKKddddKKKK"}], "note": ""}, "sreg": ["–", "–", "–", "⇔", "0", "⇔", "⇔", "–"], "flags": {"S": "N ⊕ V, para pruebas con signo.", "V": "Se pone en 0.", "N": "1 si el MSB del resultado está en 1; 0 en caso contrario.", "Z": "1 si el resultado es 0x00; 0 en caso contrario."}, "result": ["R (Resultado) es igual a Rd después de la operación."], "ex": "    andi  r17,0x0F  ; Clear upper nibble of r17\n    andi  r18,0x10  ; Isolate bit 4 in r18\n    andi  r19,0xAA  ; Clear odd bits of r19", "src": "manual", "words": "1 (2 bytes)", "groups": ["limpiar", "AND", "constante"], "common": false, "rank": 19005}, {"id": "asr", "num": "6.6", "page": 29, "mn": "ASR", "alias": ["ASR"], "variant": "", "en": "Arithmetic Shift Right", "es": "Desplazamiento aritmético a la derecha", "cat": "bits", "desc": ["Desplaza todos los bits de Rd una posición a la derecha. El bit 7 se mantiene constante. El bit 0 se carga en la bandera C del SREG. Esta operación divide efectivamente un valor con signo entre dos sin cambiar su signo. La bandera de acarreo puede usarse para redondear el resultado."], "ops": [{"v": "(i)", "op": "b7 → b7 … b0 → C", "com": "El bit 7 se mantiene; el bit 0 pasa a C"}], "syn": [{"v": "(i)", "syn": "ASR Rd", "opd": "0 ≤ d ≤ 31", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "1001010ddddd0101"}], "note": ""}, "sreg": ["–", "–", "–", "⇔", "⇔", "⇔", "⇔", "⇔"], "flags": {"S": "N ⊕ V, para pruebas con signo.", "V": "N ⊕ C, con N y C después del desplazamiento.", "N": "1 si el MSB del resultado está en 1; 0 en caso contrario.", "Z": "1 si el resultado es 0x00; 0 en caso contrario.", "C": "1 si, antes del desplazamiento, el LSB de Rd estaba en 1; 0 en caso contrario."}, "result": ["R (Resultado) es igual a Rd después de la operación."], "ex": "    ldi  r16,0x10  ; Load decimal 16 into r16\n    asr  r16       ; r16=r16 / 2\n    ldi  r17,0xFC  ; Load -4 in r17\n    asr  r17       ; r17=r17/2", "src": "manual", "words": "1 (2 bytes)", "groups": ["dividir", "desplazar", "con signo"], "common": false, "rank": 78006}, {"id": "bclr", "num": "6.7", "page": 30, "mn": "BCLR", "alias": ["BCLR"], "variant": "", "en": "Bit Clear in SREG", "es": "Limpiar bit en el SREG", "cat": "bits", "desc": ["Limpia (pone en 0) una sola bandera del SREG."], "ops": [{"v": "(i)", "op": "SREG(s) ← 0", "com": ""}], "syn": [{"v": "(i)", "syn": "BCLR s", "opd": "0≤s≤7", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "100101001sss1000"}], "note": ""}, "sreg": ["⇔", "⇔", "⇔", "⇔", "⇔", "⇔", "⇔", "⇔"], "flags": {"I": "Si s = 7, I ← 0; si no, sin cambio.", "T": "Si s = 6, T ← 0; si no, sin cambio.", "H": "Si s = 5, H ← 0; si no, sin cambio.", "S": "Si s = 4, S ← 0; si no, sin cambio.", "V": "Si s = 3, V ← 0; si no, sin cambio.", "N": "Si s = 2, N ← 0; si no, sin cambio.", "Z": "Si s = 1, Z ← 0; si no, sin cambio.", "C": "Si s = 0, C ← 0; si no, sin cambio."}, "result": [], "ex": "    bclr  0  ; Clear Carry flag\n    bclr  7  ; Disable interrupts", "src": "manual", "words": "1 (2 bytes)", "groups": ["limpiar", "bandera"], "common": false, "rank": 94007}, {"id": "bld", "num": "6.8", "page": 31, "mn": "BLD", "alias": ["BLD"], "variant": "", "en": "Bit Load from the T Bit in SREG to a Bit in Register", "es": "Cargar bit desde T a un bit de registro", "cat": "bits", "desc": ["Copia el bit T del SREG (registro de estado) al bit b del registro Rd."], "ops": [{"v": "(i)", "op": "Rd(b) ← T", "com": ""}], "syn": [{"v": "(i)", "syn": "BLD Rd,b", "opd": "0 ≤ d ≤ 31, 0 ≤ b ≤ 7", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "1111100ddddd0bbb"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "               ; Copy bit\n    bst  r1,2  ; Store bit 2 of r1 in T bit\n    bld  r0,4  ; Load T bit into bit 4 of r0", "src": "manual", "words": "1 (2 bytes)", "groups": ["copiar", "bandera", "bit"], "common": false, "rank": 80008}, {"id": "brbc", "num": "6.9", "page": 32, "mn": "BRBC", "alias": ["BRBC"], "variant": "", "en": "Branch if Bit in SREG is Cleared", "es": "Saltar si bit del SREG está en 0", "cat": "salto", "desc": ["Salto condicional relativo. Evalúa un solo bit del SREG y salta de forma relativa al PC si el bit está en 0. Esta instrucción salta de forma relativa al PC en cualquier dirección (PC - 63 ≤ destino ≤ PC + 64). El parámetro k es el desplazamiento desde el PC y se representa en complemento a dos."], "ops": [{"v": "(i)", "op": "Si SREG(s) == 0 entonces PC ← PC + k + 1, si no, PC ← PC + 1", "com": ""}], "syn": [{"v": "(i)", "syn": "BRBC s,k", "opd": "0 ≤ s ≤ 7, -64 ≤ k ≤ +63", "pc": "PC ← PC + k + 1, si se cumple la condición\nPC ← PC + 1, si la condición es falsa", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "111101kkkkkkksss"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "       cpi   r20,5    ; Compare r20 to the value 5\n       brbc  1,noteq  ; Branch if Zero flag cleared\n       ...\nnoteq: nop            ; Branch destination (do nothing)", "src": "manual", "words": "1 (2 bytes)", "groups": ["saltar", "condicional", "bandera"], "common": false, "rank": 64009}, {"id": "brbs", "num": "6.10", "page": 33, "mn": "BRBS", "alias": ["BRBS"], "variant": "", "en": "Branch if Bit in SREG is Set", "es": "Saltar si bit del SREG está en 1", "cat": "salto", "desc": ["Salto condicional relativo. Evalúa un solo bit del SREG y salta de forma relativa al PC si el bit está en 1. Esta instrucción salta de forma relativa al PC en cualquier dirección (PC - 63 ≤ destino ≤ PC + 64). El parámetro k es el desplazamiento desde el PC y se representa en complemento a dos."], "ops": [{"v": "(i)", "op": "Si SREG(s) == 1 entonces PC ← PC + k + 1, si no, PC ← PC + 1", "com": ""}], "syn": [{"v": "(i)", "syn": "BRBS s,k", "opd": "0 ≤ s ≤ 7, -64 ≤ k ≤ +63", "pc": "PC ← PC + k + 1, si se cumple la condición\nPC ← PC + 1, si la condición es falsa", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "111100kkkkkkksss"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "        bst   r0,3      ; Load T bit with bit 3 of r0\n        brbs  6,bitset  ; Branch T bit was set\n        ...\nbitset: nop             ; Branch destination (do nothing)", "src": "manual", "words": "1 (2 bytes)", "groups": ["saltar", "condicional", "bandera"], "common": false, "rank": 63010}, {"id": "brcc", "num": "6.11", "page": 34, "mn": "BRCC", "alias": ["BRCC"], "variant": "", "en": "Branch if Carry Cleared", "es": "Saltar si no hay acarreo (C = 0)", "cat": "salto", "desc": ["Salto condicional relativo. Evalúa la bandera de acarreo (C) y salta de forma relativa al PC si C está en 0. Esta instrucción salta de forma relativa al PC en cualquier dirección (PC - 63 ≤ destino ≤ PC + 64). El parámetro k es el desplazamiento desde el PC y se representa en complemento a dos. (Equivale a la instrucción BRBC 0,k.)"], "ops": [{"v": "(i)", "op": "Si C == 0 entonces PC ← PC + k + 1, si no, PC ← PC + 1", "com": ""}], "syn": [{"v": "(i)", "syn": "BRCC k", "opd": "-64 ≤ k ≤ +63", "pc": "PC ← PC + k + 1, si se cumple la condición\nPC ← PC + 1, si la condición es falsa", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "111101kkkkkkk000"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "        add   r22,r23  ; Add r23 to r22\n        brcc  nocarry  ; Branch if carry cleared\n        ...\nnocarry:\n        nop            ; Branch destination (do nothing)", "src": "manual", "words": "1 (2 bytes)", "groups": ["saltar", "condicional", "acarreo"], "common": false, "rank": 39011}, {"id": "brcs", "num": "6.12", "page": 35, "mn": "BRCS", "alias": ["BRCS"], "variant": "", "en": "Branch if Carry Set", "es": "Saltar si hay acarreo (C = 1)", "cat": "salto", "desc": ["Salto condicional relativo. Evalúa la bandera de acarreo (C) y salta de forma relativa al PC si C está en 1. Esta instrucción salta de forma relativa al PC en cualquier dirección (PC - 63 ≤ destino ≤ PC + 64). El parámetro k es el desplazamiento desde el PC y se representa en complemento a dos. (Equivale a la instrucción BRBS 0,k.)"], "ops": [{"v": "(i)", "op": "Si C == 1 entonces PC ← PC + k + 1, si no, PC ← PC + 1", "com": ""}], "syn": [{"v": "(i)", "syn": "BRCS k", "opd": "-64 ≤ k ≤ +63", "pc": "PC ← PC + k + 1, si se cumple la condición\nPC ← PC + 1, si la condición es falsa", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "111100kkkkkkk000"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "       cpi   r26,0x56  ; Compare r26 with 0x56\n       brcs  carry     ; Branch if carry set\n       ...\ncarry: nop             ; Branch destination (do nothing)", "src": "manual", "words": "1 (2 bytes)", "groups": ["saltar", "condicional", "acarreo"], "common": false, "rank": 40012}, {"id": "break", "num": "6.13", "page": 36, "mn": "BREAK", "alias": ["BREAK"], "variant": "", "en": "Break", "es": "Punto de interrupción (depuración)", "cat": "mcu", "desc": ["La instrucción BREAK es usada por el sistema de depuración en chip (On-chip Debug) y no por el software de aplicación. Cuando se ejecuta BREAK, la CPU AVR pasa al estado Detenido (Stopped). Esto le da al depurador en chip acceso a los recursos internos.", "Si el dispositivo está bloqueado, o el sistema de depuración en chip no está habilitado, la CPU tratará la instrucción BREAK como un NOP y no entrará al estado Detenido.", "Esta instrucción no está disponible en todos los dispositivos. Consulte el Apéndice A."], "ops": [{"v": "(i)", "op": "Instrucción de punto de interrupción del sistema de depuración en chip.", "com": ""}], "syn": [{"v": "(i)", "syn": "BREAK", "opd": "Ninguno", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "1001010110011000"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "", "src": "manual", "words": "1 (2 bytes)", "groups": ["depurar"], "common": false, "rank": 116013}, {"id": "breq", "num": "6.14", "page": 36, cional", "omitir", "comparar"], "common": false, "rank": 48048}, {"id": "dec", "num": "6.49", "page": 69, "mn": "DEC", "alias": ["DEC"], "variant": "", "en": "Decrement", "es": "Decrementar (restar 1)", "cat": "arit", "desc": ["Resta uno (1) al contenido del registro Rd y coloca el resultado en el registro destino Rd.", "La bandera C del SREG no se ve afectada por la operación, lo que permite usar DEC como contador de bucles en cálculos de precisión múltiple.", "Cuando se opera con valores sin signo, solo se puede esperar que los saltos BREQ y BRNE funcionen de forma consistente. Cuando se opera con valores en complemento a dos, todos los saltos con signo están disponibles."], "ops": [{"v": "(i)", "op": "Rd ← Rd - 1", "com": ""}], "syn": [{"v": "(i)", "syn": "DEC Rd", "opd": "0 ≤ d ≤ 31", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "1001010ddddd1010"}], "note": ""}, "sreg": ["–", "–", "–", "⇔", "⇔", "⇔", "⇔", "–"], "flags": {"S": "N ⊕ V, para pruebas con signo.", "V": "1 si la operación produjo desbordamiento en complemento a dos; 0 en caso contrario. Solo ocurre si Rd era 0x80 antes de la operación.", "N": "1 si el MSB del resultado está en 1; 0 en caso contrario.", "Z": "1 si el resultado es 0x00; 0 en caso contrario."}, "result": ["R (Resultado) es igual a Rd después de la operación."], "ex": "      ldi   r17,0x10  ; Load constant in r17\nloop:\n      add   r1,r2     ; Add r2 to r1\n      dec   r17       ; Decrement r17\n      brne  loop      ; Branch if r17<>0\n      nop             ; Continue (do nothing)", "src": "manual", "words": "1 (2 bytes)", "groups": ["bucle", "restar", "decrementar"], "common": true, "rank": 3049}, {"id": "des", "num": "6.50", "page": 71, "mn": "DES", "alias": ["DES"], "variant": "", "en": "Data Encryption Standard", "es": "Ronda de cifrado DES", "cat": "arit", "desc": ["El módulo es una extensión del conjunto de instrucciones de la CPU AVR que realiza iteraciones DES. El bloque de datos de 64 bits (texto plano o cifrado) se coloca en el banco de registros de la CPU, registros R0-R7, donde el LSB de los datos se coloca en el LSB de R0 y el MSB de los datos en el MSB de R7. La clave completa de 64 bits (incluidos los bits de paridad) se coloca en los registros R8-R15, con el LSB de la clave en el LSB de R8 y el MSB de la clave en el MSB de R15.", "Ejecutar una instrucción DES realiza una ronda del algoritmo DES. Se deben ejecutar dieciséis rondas en orden creciente para obtener el texto cifrado o plano correcto. Los resultados intermedios se guardan en el banco de registros (R0-R15) después de cada instrucción DES. El operando de la instrucción (K) determina qué ronda se ejecuta, y la bandera de medio acarreo (H) determina si se realiza cifrado o descifrado.", "El algoritmo DES se describe en “Specifications for the Data Encryption Standard” (Federal Information Processing Standards Publication 46). Los resultados intermedios de esta implementación difieren del estándar porque la permutación inicial y la permutación inicial inversa se realizan en cada iteración. Esto no afecta el resultado final cifrado o plano, pero reduce el tiempo de ejecución."], "ops": [{"v": "(i)", "op": "Si H == 0 entonces ronda de cifrado (R7-R0, R15-R8, K); Si H == 1 entonces ronda de descifrado (R7-R0, R15-R8, K)", "com": ""}], "syn": [{"v": "(i)", "syn": "DES K", "opd": "0x00≤K≤0x0F", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "10010100KKKK1011"}], "note": ""}, "sreg": null, "flags": {}, "result": [], "ex": "    des  0x00\n    des  0x01\n    …\n    des  0x0E\n    des  0x0F", "src": "manual", "words": "1 (2 bytes)", "groups": ["cifrar"], "common": false, "rank": 17050}, {"id": "eicall", "num": "6.51", "page": 72, "mn": "EICALL", "alias": ["EICALL"], "variant": "", "en": "Extended Indirect Call to Subroutine", "es": "Llamada indirecta extendida a subrutina", "cat": "salto", "desc": ["Llamada indirecta a una subrutina apuntada por el registro puntero Z (16 bits) del banco de registros y el registro EIND del espacio de E/S. Esta instrucción permite llamadas indirectas a todo el espacio de memoria de programa de 4M (palabras). Ver también ICALL. El puntero de pila usa un esquema de post-decremento durante EICALL.", "Esta instrucción no está disponible en todos los dispositivos. Consulte el Apéndice A."], "ops": [{"v": "(i)", "op": "PC(15:0) ← Z(15:0), PC(21:16) ← EIND", "com": ""}], "syn": [{"v": "(i)", "syn": "EICALL", "opd": "Ninguno", "pc": "Ver operación", "st": "STACK ← PC + 1 SP ← SP - 3 (3 bytes, 22 bits)"}], "stack": true, "opc": {"size": 16, "rows": [{"v": "", "bits": "1001010100011001"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "    ldi     r16,0x05  ; Set up EIND and Z-pointer\n    out     EIND,r16\n    ldi     r30,0x00\n    ldi     r31,0x10\n    eicall            ; Call to 0x051000", "src": "manual", "words": "1 (2 bytes)", "groups": ["llamar", "pila"], "common": false, "rank": 65051}, {"id": "eijmp", "num": "6.52", "page": 73, "mn": "EIJMP", "alias": ["EIJMP"], "variant": "", "en": "Extended Indirect Jump", "es": "Salto indirecto extendido", "cat": "salto", "desc": ["Salto indirecto a la dirección apuntada por el registro puntero Z (16 bits) del banco de registros y el registro EIND del espacio de E/S. Esta instrucción permite saltos indirectos a todo el espacio de memoria de programa de 4M (palabras). Ver también IJMP.", "Esta instrucción no está disponible en todos los dispositivos. Consulte el Apéndice A."], "ops": [{"v": "(i)", "op": "PC(15:0) ← Z(15:0), PC(21:16) ← EIND", "com": ""}], "syn": [{"v": "(i)", "syn": "EIJMP", "opd": "Ninguno", "pc": "Ver operación", "st": "Sin cambio"}], "stack": true, "opc": {"size": 16, "rows": [{"v": "", "bits": "1001010000011001"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "    ldi    r16,0x05  ; Set up EIND and Z-pointer\n    out    EIND,r16\n    ldi    r30,0x00\n    ldi    r31,0x10\n    eijmp            ; Jump to 0x051000", "src": "manual", "words": "1 (2 bytes)", "groups": ["saltar"], "common": false, "rank": 66052}, {"id": "elpm", "num": "6.53", "page": 73, "mn": "ELPM", "alias": ["ELPM"], "variant": "", "en": "Extended Load Program Memory", "es": "Cargar desde memoria de programa (extendido)", "cat": "datos", "desc": ["Carga un byte apuntado por el registro Z y el registro RAMPZ del espacio de E/S, y coloca ese byte en el registro destino Rd. Esta instrucción permite una inicialización de constantes o lectura de datos constantes 100% eficiente en espacio.", "La memoria de programa está organizada en palabras de 16 bits, mientras que el puntero Z es una dirección de byte. Por eso, el bit menos significativo del puntero Z selecciona el byte bajo (ZLSB == 0) o el byte alto (ZLSB == 1). Esta instrucción puede direccionar todo el espacio de memoria de programa. El registro puntero Z puede quedar sin cambio o ser incrementado. El incremento se aplica a toda la concatenación de 24 bits de RAMPZ y el puntero Z.", "Los dispositivos con capacidad de autoprogramación pueden usar ELPM para leer los valores de los bits Fuse y Lock. Consulte la documentación del dispositivo para una descripción detallada.", "Esta instrucción no está disponible en todos los dispositivos. Consulte el Apéndice A.", "El resultado de estas combinaciones es indefinido: ELPM r30, Z+ · ELPM r31, Z+"], "ops": [{"v": "(i)", "op": "R0 ← PS(RAMPZ:Z)", "com": "RAMPZ:Z: sin cambio, R0 es el registro destino implícito"}, {"v": "(ii)", "op": "Rd ← PS(RAMPZ:Z)", "com": "RAMPZ:Z: sin cambio"}, {"v": "(iii)", "op": "Rd ← PS(RAMPZ:Z), (RAMPZ:Z) ← (RAMPZ:Z) + 1", "com": "RAMPZ:Z: post-incrementado"}], "syn": [{"v": "(i)", "syn": "ELPM", "opd": "Ninguno, R0 implícito", "pc": "PC ← PC + 1", "st": ""}, {"v": "(ii)", "syn": "ELPM Rd, Z", "opd": "0 ≤ d ≤ 31", "pc": "PC ← PC + 1", "st": ""}, {"v": "(iii)", "syn": "ELPM Rd, Z+", "opd": "0 mmon": false, "rank": 23054}, {"id": "fmul", "num": "6.55", "page": 76, "mn": "FMUL", "alias": ["FMUL"], "variant": "", "en": "Fractional Multiply Unsigned", "es": "Multiplicación fraccionaria sin signo", "cat": "arit", "desc": ["Esta instrucción realiza una multiplicación sin signo de 8 bits × 8 bits → 16 bits y desplaza el resultado un bit a la izquierda.", "Sea (N.Q) un número fraccionario con N dígitos binarios a la izquierda del punto y Q dígitos binarios a la derecha. Una multiplicación entre dos números en formatos (N1.Q1) y (N2.Q2) da como resultado el formato ((N1+N2).(Q1+Q2)). En aplicaciones de procesamiento de señales, el formato (1.7) es muy usado para las entradas, lo que da un formato (2.14) para el producto. Se requiere un desplazamiento a la izquierda para que el byte alto del producto quede en el mismo formato que las entradas. La instrucción FMUL incorpora el desplazamiento en el mismo número de ciclos que MUL.", "El formato (1.7) se usa con más frecuencia con números con signo, mientras que FMUL realiza una multiplicación sin signo. Por ello, esta instrucción es más útil para calcular uno de los productos parciales al realizar una multiplicación con signo de entradas de 16 bits en formato (1.15), con resultado en formato (1.31). Nota: el resultado de FMUL puede sufrir un desbordamiento en complemento a dos si se interpreta como un número en formato (1.15). El MSB de la multiplicación antes del desplazamiento debe tenerse en cuenta y se encuentra en el bit de acarreo.", "El multiplicando Rd y el multiplicador Rr son dos registros que contienen números fraccionarios sin signo, con el punto implícito entre el bit 6 y el bit 7. El producto fraccionario sin signo de 16 bits, con el punto implícito entre el bit 14 y el bit 15, se coloca en R1 (byte alto) y R0 (byte bajo).", "Esta instrucción no está disponible en todos los dispositivos. Consulte el Apéndice A."], "ops": [{"v": "(i)", "op": "R1:R0 ← Rd × Rr (sin signo (1.15) ← sin signo (1.7) × sin signo (1.7))", "com": ""}], "syn": [{"v": "(i)", "syn": "FMUL Rd,Rr", "opd": "16 ≤ d ≤ 23, 16 ≤ r ≤ 23", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "000000110ddd1rrr"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "⇔", "⇔"], "flags": {"C": "1 si el bit 15 del resultado antes del desplazamiento a la izquierda está en 1; 0 en caso contrario.", "Z": "1 si el resultado es 0x0000; 0 en caso contrario."}, "result": ["R (Resultado) es igual a R1,R0 después de la operación."], "ex": ";******************************************************************************\n;* DESCRIPTION\n;* Signed fractional multiply of two 16-bit numbers with 32-bit result.\n;* USAGE\n;* r19:r18:r17:r16 = ( r23:r22 * r21:r20 ) << 1\n;******************************************************************************\nfmuls16x16_32:\n        clr     r2\n        fmuls   r23, r21  ; ((signed)ah * (signed)bh) << 1\n        movw    r18, r0\n        fmul    r22, r20  ; (al * bl) << 1\n        adc     r18, r2\n        movw    r16, r0\n        fmulsu  r23, r20  ; ((signed)ah * bl) << 1\n        sbc     r19, r2\n        add     r17, r0\n        adc     r18, r1\n        adc     r19, r2\n        fmulsu  r21, r22  ; ((signed)bh * al) << 1\n        sbc     r19, r2\n        add     r17, r0\n        adc     r18, r1\n        adc     r19, r2\n        ret", "src": "manual", "words": "1 (2 bytes)", "groups": ["multiplicar"], "common": false, "rank": 14055}, {"id": "fmuls", "num": "6.56", "page": 77, "mn": "FMULS", "alias": ["FMULS"], "variant": "", "en": "Fractional Multiply Signed", "es": "Multiplicación fraccionaria con signo", "cat": "arit", "desc": ["Esta instrucción realiza una multiplicación con signo de 8 bits × 8 bits → 16 bits y desplaza el resultado un bit a la izquierda.", "Sea (N.Q) un número fraccionario con N dígitos binarios a la izquierda del punto y Q dígitos binarios a la derecha. Una multiplicación entre dos números en formatos (N1.Q1) y (N2.Q2) d ", "desc": ["Carga un byte de forma indirecta desde el espacio de datos a un registro. El espacio de datos normalmente está formado por el banco de registros, la memoria de E/S y la SRAM; consulte la hoja de datos del dispositivo para una definición detallada del espacio de datos.", "La posición de datos es apuntada por el registro puntero X (16 bits) del banco de registros. El acceso a memoria está limitado al segmento de datos actual de 64 KB. Para acceder a otro segmento de datos en dispositivos con más de 64 KB de espacio de datos, se debe cambiar el registro RAMPX del área de E/S.", "El registro puntero X puede quedar sin cambio, o puede ser post-incrementado o pre-decrementado. Estas funciones son especialmente útiles para acceder a arreglos, tablas y para usar el puntero X como puntero de pila. Nótese que en dispositivos con no más de 256 bytes de espacio de datos solo se actualiza el byte bajo del puntero X; en esos dispositivos el byte alto del puntero no es usado por esta instrucción y puede emplearse para otros fines. El registro RAMPX del área de E/S se actualiza en dispositivos con más de 64 KB de espacio de datos o más de 64 KB de memoria de programa, y el incremento/decremento se suma a toda la dirección de 24 bits en esos dispositivos.", "No todas las variantes de esta instrucción están disponibles en todos los dispositivos.", "En el núcleo reducido AVRrc, la instrucción LD puede usarse para lograr la misma operación que LPM, ya que la memoria de programa está mapeada en el espacio de memoria de datos.", "El resultado de estas combinaciones es indefinido: LD r26, X+ · LD r27, X+ · LD r26, -X · LD r27, -X"], "ops": [{"v": "(i)", "op": "Rd ← DS(X)", "com": "X: sin cambio"}, {"v": "(ii)", "op": "Rd ← DS(X), X ← X + 1", "com": "X: post-incrementado"}, {"v": "(iii)", "op": "X ← X - 1, Rd ← DS(X)", "com": "X: pre-decrementado"}], "syn": [{"v": "(i)", "syn": "LD Rd, X", "opd": "0 ≤ d ≤ 31", "pc": "PC ← PC + 1", "st": ""}, {"v": "(ii)", "syn": "LD Rd, X+", "opd": "0 ≤ d ≤ 31", "pc": "PC ← PC + 1", "st": ""}, {"v": "(iii)", "syn": "LD Rd, -X", "opd": "0 ≤ d ≤ 31", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "(i)", "bits": "1001000ddddd1100"}, {"v": "(ii)", "bits": "1001000ddddd1101"}, {"v": "(iii)", "bits": "1001000ddddd1110"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "    clr  r27       ; Clear X high byte\n    ldi  r26,0x60  ; Set X low byte to 0x60\n    ld   r0,X+     ; Load r0 with data space loc. 0x60(X post inc)\n    ld   r1,X      ; Load r1 with data space loc. 0x61\n    ldi  r26,0x63  ; Set X low byte to 0x63\n    ld   r2,X      ; Load r2 with data space loc. 0x63\n    ld   r3,–X     ; Load r3 with data space loc. 0x62(X pre dec)", "src": "manual", "words": "1 (2 bytes)", "groups": ["cargar", "memoria de datos", "puntero"], "common": false, "rank": 103066}, {"id": "ld-y", "num": "6.67", "page": 89, "mn": "LD", "alias": ["LD", "LDD"], "variant": "", "en": "Load Indirect from Data Space to Register using Y", "es": "Cargar indirecto desde espacio de datos usando Y", "cat": "datos", "desc": ["Carga un byte de forma indirecta con o sin desplazamiento desde el espacio de datos a un registro. El espacio de datos normalmente está formado por el banco de registros, la memoria de E/S y la SRAM; consulte la hoja de datos del dispositivo para una definición detallada del espacio de datos.", "La posición de datos es apuntada por el registro puntero Y (16 bits) del banco de registros. El acceso a memoria está limitado al segmento de datos actual de 64 KB. Para acceder a otro segmento de datos en dispositivos con más de 64 KB de espacio de datos, se debe cambiar el registro RAMPY del área de E/S.", "El registro puntero Y puede quedar sin cambio, o puede ser post-incrementado o pre-decrementado. Estas funciones son especialmente útiles para acceder a arreglos, tablas y para usar el puntero Y como puntero de pila. Nótese que en dispositivos con no más de 256 bytes de espacio de datos solo se actualiza el byte bajo del puntero Y; en esos dispositivos el byte alto del puntero no es usado por esta instrucción y puede emplearse para otros fines. El registro RAMPY del área de E/S se actualiza en dispositivos con más de 64 KB de espacio de datos o más de 64 KB de memoria de programa, y el incremento/decremento/desplazamiento se suma a toda la dirección de 24 bits en esos dispositivos.", "No todas las variantes de esta instrucción están disponibles en todos los dispositivos.", "En el núcleo reducido AVRrc, la instrucción LD puede usarse para lograr la misma operación que LPM, ya que la memoria de programa está mapeada en el espacio de memoria de datos.", "El resultado de estas combinaciones es indefinido: LD r28, Y+ · LD r29, Y+ · LD r28, -Y · LD r29, -Y"], "ops": [{"v": "(i)", "op": "Rd ← DS(Y)", "com": "Y: sin cambio"}, {"v": "(ii)", "op": "Rd ← DS(Y), Y ← Y + 1", "com": "Y: post-incrementado"}, {"v": "(iii)", "op": "Y ← Y - 1, Rd ← DS(Y)", "com": "Y: pre-decrementado"}, {"v": "(iv)", "op": "Rd ← DS(Y+q)", "com": "Y: sin cambio, q: desplazamiento"}], "syn": [{"v": "(i)", "syn": "LD Rd, Y", "opd": "0 ≤ d ≤ 31", "pc": "PC ← PC + 1", "st": ""}, {"v": "(ii)", "syn": "LD Rd, Y+", "opd": "0 ≤ d ≤ 31", "pc": "PC ← PC + 1", "st": ""}, {"v": "(iii)", "syn": "LD Rd, -Y", "opd": "0 ≤ d ≤ 31", "pc": "PC ← PC + 1", "st": ""}, {"v": "(iv)", "syn": "LDD Rd, Y+q", "opd": "0 ≤ d ≤ 31, 0 ≤ q ≤ 63", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "(i)", "bits": "1000000ddddd1000"}, {"v": "(ii)", "bits": "1001000ddddd1001"}, {"v": "(iii)", "bits": "1001000ddddd1010"}, {"v": "(iv)", "bits": "10q0qq0ddddd1qqq"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "    clr  r29       ; Clear Y high byte\n    ldi  r28,0x60  ; Set Y low byte to 0x60\n    ld   r0,Y+     ; Load r0 with data space loc. 0x60(Y post inc)\n    ld   r1,Y      ; Load r1 with data space loc. 0x61\n    ldi  r28,0x63  ; Set Y low byte to 0x63\n    ld   r2,Y      ; Load r2 with data space loc. 0x63\n    ld   r3,-Y     ; Load r3 with data space loc. 0x62(Y pre dec)\n    ldd  r4,Y+2    ; Load r4 with data space loc. 0x64", "src": "manual", "words": "1 (2 bytes)", "groups": ["cargar", "memoria de datos", "puntero"], "common": false, "rank": 103067}, {"id": "ld-z", "num": "6.68", "page": 90, "mn": "LD", "alias": ["LD", "LDD"], "variant": "", "en": "Load Indirect From Data Space to Register using Z", "es": "Cargar indirecto desde espacio de datos usando Z", "cat": "datos", "desc": ["Carga un byte de forma indirecta con o sin desplazamiento desde el espacio de datos a un registro. El espacio de datos normalmente está formado por el banco de registros, la memoria de E/S y la SRAM; consulte la hoja de datos del dispositivo para una definición detallada del espacio de datos.", "La posición de datos es apuntada por el registro puntero Z (16 bits) del banco de registros. El acceso a memoria está limitado al segmento de datos actual de 64 KB. Para acceder a otro segmento de datos en dispositivos con más de 64 KB de espacio de datos, se debe cambiar el registro RAMPZ del área de E/S.", "El registro puntero Z puede quedar sin cambio, o puede ser post-incrementado o pre-decrementado. Estas funciones son especialmente útiles para usar el puntero Z como puntero de pila. Sin embargo, como el registro puntero Z puede usarse para llamadas indirectas a subrutinas, saltos indirectos y búsqueda en tablas, a menudo es más conveniente usar el puntero X o Y como puntero de pila dedicado. Nótese que en dispositivos con no más de 256 bytes de espacio de datos solo se actualiza el byte bajo del puntero Z; en esos dispositivos el byte alto del puntero no es usado por esta instrucción y puede emplearse para otros fines. El registro RAMPZ del área de E/S se actualiza en dispositivos con más de 64 KB de espacio de datos o más de 64 KB de memoria de programa, y el inc rank": 99071}, {"id": "lpm", "num": "6.72", "page": 95, "mn": "LPM", "alias": ["LPM"], "variant": "", "en": "Load Program Memory", "es": "Cargar desde memoria de programa (Flash)", "cat": "datos", "desc": ["Carga un byte apuntado por el registro Z en el registro destino Rd. Esta instrucción permite una inicialización de constantes o lectura de datos constantes 100% eficiente en espacio.", "La memoria de programa está organizada en palabras de 16 bits, mientras que el puntero Z es una dirección de byte. Por eso, el bit menos significativo del puntero Z selecciona el byte bajo (ZLSb == 0) o el byte alto (ZLSb == 1). Esta instrucción puede direccionar los primeros 64 KB (32K palabras) de la memoria de programa. El registro puntero Z puede quedar sin cambio o ser incrementado. El incremento no se aplica al registro RAMPZ.", "Los dispositivos con capacidad de autoprogramación pueden usar LPM para leer los valores de los bits Fuse y Lock. Consulte la documentación del dispositivo para una descripción detallada.", "La instrucción LPM no está disponible en todos los dispositivos. Consulte el Apéndice A.", "El resultado de estas combinaciones es indefinido: LPM r30, Z+ · LPM r31, Z+"], "ops": [{"v": "(i)", "op": "R0 ← PS(Z)", "com": "Z: sin cambio, R0 es el registro destino implícito"}, {"v": "(ii)", "op": "Rd ← PS(Z)", "com": "Z: sin cambio"}, {"v": "(iii)", "op": "Rd ← PS(Z), Z ← Z + 1", "com": "Z: post-incrementado"}], "syn": [{"v": "(i)", "syn": "LPM", "opd": "Ninguno, R0 implícito", "pc": "PC ← PC + 1", "st": ""}, {"v": "(ii)", "syn": "LPM Rd, Z", "opd": "0 ≤ d ≤ 31", "pc": "PC ← PC + 1", "st": ""}, {"v": "(iii)", "syn": "LPM Rd, Z+", "opd": "0 ≤ d ≤ 31", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "(i)", "bits": "1001010111001000"}, {"v": "(ii)", "bits": "1001000ddddd0100"}, {"v": "(iii)", "bits": "1001000ddddd0101"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "        ldi  ZH lse, "rank": 83110}, {"id": "sleep", "num": "6.111", "page": 132, "mn": "SLEEP", "alias": ["SLEEP"], "variant": "", "en": "SLEEP", "es": "Modo de bajo consumo (dormir)", "cat": "mcu", "desc": ["Esta instrucción pone el circuito en el modo de reposo (sleep) definido por el registro de control del MCU."], "ops": [{"v": "(i)", "op": "Consulte la documentación del dispositivo para el uso detallado de SLEEP.", "com": ""}], "syn": [{"v": "(i)", "syn": "SLEEP", "opd": "Ninguno", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "1001010110001000"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "    mov    r0,r11       ; Copy r11 to r0\n    ldi    r16,(1<<SE)  ; Enable sleep mode\n    out    MCUCR, r16\n    sleep               ; Put MCU in sleep mode", "src": "manual", "words": "1 (2 bytes)", "groups": ["esperar", "dormir"], "common": false, "rank": 114111}, {"id": "spm-avre", "num": "6.112", "page": 133, "mn": "SPM", "alias": ["SPM"], "variant": "AVRe", "en": "Store Program Memory", "es": "Escribir en memoria de programa (AVRe)", "cat": "datos", "desc": ["SPM puede usarse para borrar una página de la memoria de programa, escribir una página de la memoria de programa (que ya esté borrada) y configurar los bits de bloqueo del Boot Loader. En algunos dispositivos, la memoria de programa puede escribirse una palabra a la vez. En otros, se puede programar una página completa simultáneamente después de llenar primero un búfer temporal de página. En todos los casos, la memoria de programa debe borrarse una página a la vez.", "Cuando se borra la memoria de programa, los registros RAMPZ y Z se usan como dirección de página. Cuando se escribe la memoria de programa, los registros RAMPZ y Z se usan como dirección de página o de palabra, y el par de registros R1:R0 se usa como dato (R1 determina el byte alto de la instrucción y R0 el byte bajo). La Flash se accede por palabras en las operaciones de escritura del espacio de código, por lo que el bit menos significativo de la concatenación de RAMPZ con Z debe ponerse en ‘0’.", "Al configurar los bits de bloqueo del Boot Loader, el par R1:R0 se usa como dato. Consulte la documentación del dispositivo para una descripción detallada del uso de SPM. Esta instrucción puede direccionar toda la memoria de programa.", "La instrucción SPM no está disponible en todos los dispositivos. Consulte el Apéndice A."], "ops": [{"v": "(i)", "op": "PS(RAMPZ:Z) ← 0xffff", "com": "Borrar página de memoria de programa"}, {"v": "(ii)", "op": "PS(RAMPZ:Z) ← R1:R0", "com": "Escribir palabra en memoria de programa"}, {"v": "(iii)", "op": "PS(RAMPZ:Z) ← R1:R0", "com": "Cargar búfer de página"}, {"v": "(iv)", "op": "PS(RAMPZ:Z) ← BUFFER", "com": "Escribir búfer de página en memoria de programa"}, {"v": "(v)", "op": "BLBITS ← R1:R0", "com": "Configurar bits de bloqueo del Boot Loader"}], "syn": [{"v": "(i)-(v)", "syn": "SPM", "opd": "Ninguno", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "", "bits": "1001010111101000"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "; This example shows SPM write of one page for devices with page write\n; - the routine writes one page of data from RAM to Flash\n;   the first data location in RAM is pointed to by the Y-pointer\n;   the first data location in Flash is pointed to by the Z-pointer\n; - error handling is not included\n; - the routine must be placed inside the boot space\n;   (at least the do_spm sub routine)\n; - registers used: r0, r1, temp1, temp2, looplo, loophi, spmcrval\n; (temp1, temp2, looplo, loophi, spmcrval must be defined by the user)\n; storing and restoring of registers is not included in the routine\n; register usage can be optimized at the expense of code size\n\n        equ   PAGESIZEB = PAGESIZE*2             ; PAGESIZEB is page size in BYTES, not words\n        org   SMALLBOOTSTART\n\nwrite_page:\n                                                 ; page erase\n        ldi   spmcrval, (1<<PGERS) + (1<<SPMEN)\n        call  do_spm\n                                                 ; transfer data from RAM to Flash page buffer\n        ldi   looplo, low(PAGESIZEB)             ; init loop variable\n        ldi   loophi, high(PAGESIZEB)            ; not required for PAGESIZEB<=256\n\nwrloop:\n        ld    r0, Y+\n        ld    r1, Y+\n        ldi   spmcrval, (1<<SPMEN)\n        call  do_spm\n        adiw  ZL, 2\n        sbiw  looplo, 2                          ; use subi for PAGESIZEB<=256\n        brne  wrloop\n                                                 ; execute page write\n        subi  ZL, low(PAGESIZEB)                 ; restore pointer\n        sbci  ZH, high(PAGESIZEB)                ; not required for PAGESIZEB<=256\n        ldi   spmcrval, (1<<PGWRT) + (1<<SPMEN)\n        call  do_spm\n\n                                                 ; read back and check, optional\n        ldi   looplo, low(PAGESIZEB)             ; init loop variable\n        ldi   loophi, high(PAGESIZEB)            ; not required for PAGESIZEB<=256\n        subi  YL, low(PAGESIZEB)                 ; restore pointer\n        sbci  YH, high(PAGESIZEB)\n\nrdloop:\n        lpm   r0, Z+\n        ld    r1, Y+\n        cpse  r0, r1\n        jmp   error\n        sbiw  looplo, 2                          ; use subi for PAGESIZEB<=256\n        brne  rdloop\n\n        ret                                      ; return\n\ndo_spm:\n        in    temp2, SREG                        ; input: spmcrval determines SPM action\n        cli                                      ; disable interrupts if enabled, store status\n\nwait:\n        in    temp1, SPMCR                       ; check for previous SPM complete\n        sbrc  temp1, SPMEN\n        rjmp  wait\n\n        out   SPMCR, spmcrval                    ; SPM timed sequence\n        spm\n\n        out   SREG, temp2                        ; restore SREG (to enable interrupts if\n                                                 ; originally enabled)\n        ret", "src": "manual", "words": "1 (2 bytes)", "groups": ["guardar", "memoria de programa"], "common": false, "rank": 108112}, {"id": "spm-avrxm", "num": "6.113", "page": 135, "mn": "SPM", "alias": ["SPM"], "variant": "AVRxm, AVRxt", "en": "Store Program Memory", "es": "Escribir en memoria de programa (AVRxm, AVRxt)", "cat": "datos", "desc": ["SPM puede usarse para borrar una página de la memoria de programa y para escribir una página de la memoria de programa (que ya esté borrada). En algunos dispositivos, la memoria de programa puede escribirse una palabra a la vez. En otros, se puede programar una página completa simultáneamente después de llenar primero un búfer temporal de página. En todos los casos, la memoria de programa debe borrarse una página a la vez.", "Cuando se borra la memoria de programa, los registros RAMPZ y Z se usan como dirección de página. Cuando se escribe la memoria de programa, los registros RAMPZ y Z se usan como dirección de página o de palabra, y el par de registros R1:R0 se usa como dato (R1 determina el byte alto de la instrucción y R0 el byte bajo). La Flash se accede por palabras en las operaciones de escritura del espacio de código, por lo que el bit menos significativo de la concatenación de RAMPZ con Z debe ponerse en ‘0’.", "Consulte la documentación del dispositivo para una descripción detallada del uso de SPM. Esta instrucción puede direccionar toda la memoria de programa.", "La instrucción SPM no está disponible en todos los dispositivos. Consulte el Apéndice A.", "Notas: (1) No todos los dispositivos pueden escribir directamente en la memoria de programa. (2) No todos los dispositivos tienen búfer de página. Ver la hoja de datos del dispositivo."], "ops": [{"v": "(i)", "op": "PS(RAMPZ:Z) ← 0xffff", "com": "Borrar página de memoria de programa"}, {"v": "(ii)", "op": "PS(RAMPZ:Z) ← R1:R0", "com": "Escribir palabra en memoria de programa (1)"}, {"v": "(iii)", "op": "PS(RAMPZ:Z) ← R1:R0", "com": "Cargar búfer de página (2)"}, {"v": "(iv)", "op": "PS(RAMPZ:Z) ← BUFFER", "com": "Escribir búfer de página en memoria de programa (2)"}, {"v": "(v)", "op": "PS(RAMPZ:Z) ← 0xffff, Z ← Z + 2", "com": "Borrar página de memoria de programa, Z post-incrementado"}, {"v": "(vi)", "op": "PS(RAMPZ:Z) ← R1:R0, Z ← Z + 2", "com": "Escribir palabra en memoria de programa, Z post-incrementado (1)"}, {"v": "(vii)", "op": "PS(RAMPZ:Z) ← R1:R0, Z ← Z + 2", "com": "Cargar búfer de página, Z post-incrementado (2)"}, {"v": "(viii)", "op": "PS(RAMPZ:Z) ← BUFFER, Z ← Z + 2", "com": "Escribir búfer de página en memoria de programa, Z post-incrementado (2)"}], "syn": [{"v": "(i)-(iv)", "syn": "SPM", "opd": "Ninguno", "pc": "PC ← PC + 1", "st": ""}, {"v": "(v)-(viii)", "syn": "SPM Z+", "opd": "Ninguno", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "(i)-(iv)", "bits": "1001010111101000"}, {"v": "(v)-(viii)", "bits": "1001010111111000"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "", "src": "manual", "words": "1 (2 bytes)", "groups": ["guardar", "memoria de programa"], "common": false, "rank": 108113}, {"id": "st-x", "num": "6.114", "page": 136, "mn": "ST", "alias": ["ST"], "variant": "", "en": "Store Indirect From Register to Data Space using Index X", "es": "Guardar indirecto en espacio de datos usando X", "cat": "datos", "desc": ["Guarda un byte de forma indirecta desde un registro al espacio de datos. El espacio de datos normalmente está formado por el banco de registros, la memoria de E/S y la SRAM; consulte la hoja de datos del dispositivo para una definición detallada del espacio de datos.", "La posición de datos es apuntada por el registro puntero X (16 bits) del banco de registros. El acceso a memoria está limitado al segmento de datos actual de 64 KB. Para acceder a otro segmento de datos en dispositivos con más de 64 KB de espacio de datos, se debe cambiar el registro RAMPX del área de E/S.", "El registro puntero X puede quedar sin cambio, o puede ser post-incrementado o pre-decrementado. Estas funciones son especialmente útiles para acceder a arreglos, tablas y para usar el puntero X como puntero de pila. Nótese que en dispositivos con no más de 256 bytes de espacio de datos solo se actualiza el byte bajo del puntero X; en esos dispositivos el byte alto del puntero no es usado por esta instrucción y puede emplearse para otros fines. El registro RAMPX del área de E/S se actualiza en dispositivos con más de 64 KB de espacio de datos o más de 64 KB de memoria de programa, y el incremento/decremento se suma a toda la dirección de 24 bits en esos dispositivos.", "No todas las variantes de esta instrucción están disponibles en todos los dispositivos.", "El resultado de estas combinaciones es indefinido: ST X+, r26 · ST X+, r27 · ST -X, r26 · ST -X, r27"], "ops": [{"v": "(i)", "op": "DS(X) ← Rr", "com": "X: sin cambio"}, {"v": "(ii)", "op": "DS(X) ← Rr, X ← X+1", "com": "X: post-incrementado"}, {"v": "(iii)", "op": "X ← X - 1, DS(X) ← Rr", "com": "X: pre-decrementado"}], "syn": [{"v": "(i)", "syn": "ST X, Rr", "opd": "0 ≤ r ≤ 31", "pc": "PC ← PC + 1", "st": ""}, {"v": "(ii)", "syn": "ST X+, Rr", "opd": "0 ≤ r ≤ 31", "pc": "PC ← PC + 1", "st": ""}, {"v": "(iii)", "syn": "ST -X, Rr", "opd": "0 ≤ r ≤ 31", "pc": "PC ← PC + 1", "st": ""}], "stack": false, "opc": {"size": 16, "rows": [{"v": "(i)", "bits": "1001001rrrrr1100"}, {"v": "(ii)", "bits": "1001001rrrrr1101"}, {"v": "(iii)", "bits": "1001001rrrrr1110"}], "note": ""}, "sreg": ["–", "–", "–", "–", "–", "–", "–", "–"], "flags": {}, "result": [], "ex": "    clr  r27       ; Clear X high byte\n    ldi  r26,0x60  ; Set X low byte to 0x60\n    st   X+,r0     ; Store r0 in data space loc. 0x60(X post inc)\n    st   X,r1      ; Store r1 in data space loc. 0x61\n    ldi  r26,0x63  ; Set X low byte to 0x63\n    st   X,r2      ; Store r2 in data space loc. 0x63\n    st   -X,r3     ; Store r3 in data space loc. 0x62(X pre dec)", "src": "manual", "words": "1 (2 bytes)", "groups": ["guardar", "memoria de datos", "puntero"], "common": false, "rank": 104114}, {"id": "st-y", "num": "6.115", "page": 138, "mn": "ST", "alias": ["ST", "STD"], "variant": "", "en": "Store Indirect From Register to Data Space using Index Y", "es": "Guardar indirecto en espacio de datos usando Y", "cat": "datos", "desc": ["Guarda un byte de forma indirecta con o sin desplazamiento desde un registro al espacio de datos. El espacio de datos normalmente está formado por el banco de registros, la memoria de E/S y la SRAM; consulte la hoja de datos del dispositivo para una definición detallada del espacio de datos.", "La posición de datos es apuntada por el registro puntero Y (16 bits) del banco de registros. El acceso a memoria está limitado al segmento de datos actual de 64 KB. Para acceder a otro segmento de datos en dispositivos con más de 64 KB de espacio de datos, se debe cambiar el registro RAMPY del área de E/S.", "El registro puntero Y puede quedar sin cambio, o puede ser post-incrementado o pre-decrementado. Estas funciones son especialmente útiles para acceder a arreglos, tablas y para usar el puntero Y como puntero de pila. Nótese que en dispositivos con no más de 256 bytes de espacio de datos solo se actualiza el byte bajo del puntero Y; en esos dispositivos el byte alto del puntero no es usado por esta instrucción y puede emplearse para otros fines. El registro RAMPY del área de E/S se actualiza en dispositivos con más de 64 KB de espacio de datos o más de 64 KB de memoria de programa, y el incremento/decremento/desplazamiento se suma a toda la dirección de 24 bits en esos dispositivos.", "No todas las variantes de esta instrucción están disponibles en todos los dispositivos.", "El resultado de estas combinaciones es indefinido: ST Y+, r28 · ST Y+, r29 · ST -Y, r28 · ST -Y, r29"], "ops": [{"v": "(i)", tivo para una definición detallada del espacio de datos.", "La posición de datos es apuntada por el registro puntero Z (16 bits) del banco de registros. El acceso a memoria está limitado al segmento de datos actual de 64 KB. Para acceder a otro segmento de datos en dispositivos con más de 64 KB de espacio de datos, se debe cambiar el registro RAMPZ del área de E/S.", "El registro puntero Z puede quedar sin cambio, o puede ser post-incrementado o pre-decrementado. Estas funciones son especialmente útiles para usar el puntero Z como puntero de pila. Sin embargo, como el registro puntero Z puede usarse para llamadas indirectas a subrutinas, saltos indirectos y búsqueda en tablas, a menudo es más conveniente usar el puntero X o Y como puntero de pila dedicado. Nótese que en dispositivos con no más de 256 bytes de espacio de datos solo se actualiza el byte bajo del puntero Z; en esos dispositivos el byte alto del puntero no es usado por esta instrucción y puede emplearse para otros fines. El registro RAMPZ del área de E/S se actualiza en dispositivos con más de 64 KB de espacio de datos o más de 64 KB de memoria de programa, y el incremento/decremento/desplazamiento se suma a toda la dirección de 24 bits en esos dispositivos.", "No todas las variantes de esta instrucción están disponibles en todos los dispositivos.", "El resultado de estas combinaciones es indefinido: ST Z+, r30 · ST Z+, r31 · ST -Z, r30 · ST -Z, r31"], "ops": [{"v": "(i)", "op": "DS(Z) ← Rr", "com": "Z: sin cambio"}, {"v": "(ii)", "op": "DS(Z) ← Rr, Z ← Z+1", "com": "Z: post-incrementado"}, {"v": "(iii)", "op": "Z ← Z - 1, DS(Z) ← Rr", "com": "Z: pre-decrementado"}, {"v": "(iv)", "op": "DS(Z+q) ← Rr", "com": "Z: sin cambio, q: desplazamiento"}], "syn": [{"v": "(i)", "syn": "ST Z, Rr", "opd": "0 ≤ r ≤ 31", "pc": "PC ← PC + 1", "st": ""}, {"v": "(ii)", "syn": "ST Z+, Rr", "opd": "0 ≤ r ≤ 31", "pc": "PC ← PC + 1", "st": ""}, {"v": "(iii)", "syn": "ST -Z, Rr", "opd": "0 ≤ r ≤ 31", "pc": "PC ← PC + 1", "st":
